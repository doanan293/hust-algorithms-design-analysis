[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-relay-research-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cvxpy>=1.6,<2",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "Pillow>=10.4,<12",
  "pyproj>=3.6,<4",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/support"]
